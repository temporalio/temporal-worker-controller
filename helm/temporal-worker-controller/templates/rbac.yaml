{{- if .Values.rbac.create }}
# permissions to do leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-leader-election-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (printf "%s-service-account" .Release.Name) }}
    namespace: {{ .Release.Namespace }}
---
# The controller reads its own ServiceAccount at startup to derive a stable
# identity suffix (the SA UID) used to claim Worker Deployment ownership. The
# ServiceAccount lives in the release namespace, so a namespaced Role suffices in
# both cluster-wide and namespace-scoped modes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-identity-reader-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - {{ .Values.serviceAccount.name | default (printf "%s-service-account" .Release.Name) }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-identity-reader-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-identity-reader-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (printf "%s-service-account" .Release.Name) }}
    namespace: {{ .Release.Namespace }}
---
{{- if .Values.rbac.restrictWatchNamespaces }}
# Namespace-scoped mode: the manager role is emitted as a namespaced Role in each
# watched namespace. The one cluster-scoped rule (namespaces get) is handled by the
# separate manager-cluster-role below.
{{- range .Values.rbac.restrictWatchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" $ | nindent 4 }}
  name: {{ $.Release.Name }}-{{ $.Release.Namespace }}-manager-role
  namespace: {{ . }}
rules:
  # GENERATED RULES (NAMESPACED) BEGIN - do not edit; run 'make manifests' to update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - update
  - apiGroups:
      - authorization.k8s.io
    resources:
      - localsubjectaccessreviews
    verbs:
      - create
  - apiGroups:
      - temporal.io
    resources:
      - connections
      - temporalconnections
      - workerresourcetemplates
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - temporal.io
    resources:
      - connections/finalizers
      - temporalconnections/finalizers
      - temporalworkerdeployments/finalizers
      - workerdeployments/finalizers
    verbs:
      - update
  - apiGroups:
      - temporal.io
    resources:
      - temporalconnections/status
      - temporalworkerdeployments/status
      - workerdeployments/status
      - workerresourcetemplates/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - temporal.io
    resources:
      - temporalworkerdeployments
      - workerdeployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # GENERATED RULES (NAMESPACED) END
  {{- range $.Values.workerResourceTemplate.allowedResources }}
  - apiGroups:
      {{- range .apiGroups }}
      - {{ . | quote }}
      {{- end }}
    resources:
      {{- range .resources }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - create
      - delete
      - get
      - patch
      - update
  {{- end }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-manager-role
rules:
  # GENERATED RULES BEGIN - do not edit; run 'make manifests' to update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - update
  - apiGroups:
      - authorization.k8s.io
    resources:
      - localsubjectaccessreviews
    verbs:
      - create
  - apiGroups:
      - temporal.io
    resources:
      - connections
      - temporalconnections
      - workerresourcetemplates
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - temporal.io
    resources:
      - connections/finalizers
      - temporalconnections/finalizers
      - temporalworkerdeployments/finalizers
      - workerdeployments/finalizers
    verbs:
      - update
  - apiGroups:
      - temporal.io
    resources:
      - temporalconnections/status
      - temporalworkerdeployments/status
      - workerdeployments/status
      - workerresourcetemplates/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - temporal.io
    resources:
      - temporalworkerdeployments
      - workerdeployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # GENERATED RULES END
  # Rules for managing resources attached via WorkerResourceTemplate.
  # Driven entirely by workerResourceTemplate.allowedResources in values.yaml.
  {{- range .Values.workerResourceTemplate.allowedResources }}
  - apiGroups:
      {{- range .apiGroups }}
      - {{ . | quote }}
      {{- end }}
    resources:
      {{- range .resources }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - create
      - delete
      - get
      - patch
      - update
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.restrictWatchNamespaces }}
# Namespace-scoped mode: the manager role is bound only within the watched namespaces
# (RoleBindings below). The one grant that must stay cluster-scoped is namespaces "get"
# (restricted to the release namespace), used to read the namespace UID for the legacy
# controller identity during the migration window. It is split into a minimal
# manager-cluster-role and can be removed once the legacy identity is no longer needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-manager-cluster-role
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - {{ .Release.Namespace }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-manager-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-manager-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (printf "%s-service-account" .Release.Name) }}
    namespace: {{ .Release.Namespace }}
{{- range .Values.rbac.restrictWatchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" $ | nindent 4 }}
  name: {{ $.Release.Name }}-{{ $.Release.Namespace }}-manager-rolebinding
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-{{ $.Release.Namespace }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name | default (printf "%s-service-account" $.Release.Name) }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    {{- include "temporal-worker-controller.labels" . | nindent 4 }}
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (printf "%s-service-account" .Release.Name) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
