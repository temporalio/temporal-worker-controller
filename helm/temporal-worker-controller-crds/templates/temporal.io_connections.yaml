---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: connections.temporal.io
spec:
  group: temporal.io
  names:
    kind: Connection
    listKind: ConnectionList
    plural: connections
    singular: connection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Temporal server endpoint
      jsonPath: .spec.hostPort
      name: Host
      type: string
    - description: Age
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              apiKey:
                properties:
                  path:
                    type: string
                  secretRef:
                    properties:
                      key:
                        type: string
                      name:
                        default: ""
                        type: string
                      optional:
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: Only one of secretRef or path may be set
                  rule: has(self.secretRef) != has(self.path)
              apiKeySecretRef:
                properties:
                  key:
                    type: string
                  name:
                    default: ""
                    type: string
                  optional:
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              hostPort:
                pattern: ^([a-zA-Z0-9.-]+:[0-9]+|(dns|xds|passthrough)://[a-zA-Z0-9._/:-]+)$
                type: string
              mutualTLSSecretRef:
                properties:
                  name:
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              tls:
                properties:
                  caCertSecretRef:
                    properties:
                      name:
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  serverName:
                    pattern: ^[a-zA-Z0-9.-]+$
                    type: string
                type: object
            required:
            - hostPort
            type: object
            x-kubernetes-validations:
            - message: Only one of mutualTLSSecretRef, apiKeySecretRef or apiKey may
                be set
              rule: '!(has(self.mutualTLSSecretRef) && (has(self.apiKeySecretRef)
                || has(self.apiKey)))'
            - message: Only one of apiKeySecretRef or apiKey may be set
              rule: (has(self.mutualTLSSecretRef) || (!(has(self.apiKeySecretRef)
                && has(self.apiKey))))
            - message: tls.caCertSecretRef cannot be combined with mutualTLSSecretRef;
                bundle the CA into that secret's own ca.crt key instead
              rule: '!(has(self.mutualTLSSecretRef) && has(self.tls) && has(self.tls.caCertSecretRef))'
          status:
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
