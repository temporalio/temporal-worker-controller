name: Update Changelog

on:
  release:
    types: [published]
  # Allow manual runs for a specific tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to generate the changelog entry for"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write # required to open the changelog PR

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags are required to diff between releases.
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Update changelog
        uses: shazib-summar/automated-changelog-gh@v0.2.0
        with:
          tag: ${{ github.event.inputs.tag }}
          mode: prepend
          # Open a pull request instead of committing straight to the default branch.
          pull-request: true
          pr-labels: changelog,docs,automated
          reviewers: shazib-summar
