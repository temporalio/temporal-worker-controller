name: Helm Chart Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Build chart dependencies
        run: helm repo add jetstack https://charts.jetstack.io && helm dependency build helm/temporal-worker-controller

      - name: Lint chart
        run: helm lint --strict helm/temporal-worker-controller

  helm-template:
    name: Template Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Build chart dependencies
        run: helm repo add jetstack https://charts.jetstack.io && helm dependency build helm/temporal-worker-controller

      - name: Template with default values
        run: helm template test-release helm/temporal-worker-controller

      - name: Template with namespace creation
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set namespace.create=true

      - name: Template with auth proxy disabled
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set metrics.disableAuth=true

      - name: Template with kube-rbac-proxy image override
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set kubeRBACProxy.image.registry=example.invalid \
            --set kubeRBACProxy.image.repository=kube-rbac-proxy \
            --set kubeRBACProxy.image.tag=test \
            --set kubeRBACProxy.image.pullPolicy=Always

      - name: Template with restricted watch namespaces
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set 'rbac.restrictWatchNamespaces={ns-a,ns-b}'

      - name: Template with extra manager environment variables
        run: |
          set -euo pipefail
          rendered=$(helm template test-release helm/temporal-worker-controller \
            --set-string 'extraEnv[0].name=HTTP_PROXY' \
            --set-string 'extraEnv[0].value=http://proxy.example.com:8080' \
            --set-string 'extraEnv[1].name=API_TOKEN' \
            --set-string 'extraEnv[1].valueFrom.secretKeyRef.name=controller-secrets' \
            --set-string 'extraEnv[1].valueFrom.secretKeyRef.key=api-token')
          echo "$rendered" | grep -q 'name: HTTP_PROXY'
          echo "$rendered" | grep -q 'value: http://proxy.example.com:8080'
          echo "$rendered" | grep -q 'name: API_TOKEN'
          echo "$rendered" | grep -q 'name: controller-secrets'
          echo "$rendered" | grep -q 'key: api-token'

      - name: Reject extraEnv entries without a name
        run: |
          if helm template test-release helm/temporal-worker-controller \
            --set-string 'extraEnv[0].value=http://proxy.example.com:8080'; then
            echo "expected helm template to fail when extraEnv is missing name" >&2
            exit 1
          fi

      - name: Template with end user roles disabled
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set rbac.createEndUserRoles=false

  helm-lint-crds:
    name: Lint CRDs Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Lint CRDs chart
        run: helm lint --strict helm/temporal-worker-controller-crds

  helm-template-crds:
    name: Template CRDs Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Template CRDs chart
        run: helm template test-release helm/temporal-worker-controller-crds

  helm-check-rbac:
    name: Check Helm RBAC wasn't manually updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate and diff
        run: make manifests && git diff --exit-code helm/temporal-worker-controller/templates/rbac.yaml

  helm-check-values-schema:
    name: Check values.schema.json is generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate and diff
        run: make helm-values-schema && git diff --exit-code helm/temporal-worker-controller/values.schema.json

  helm-validate-succeed:
    name: All Helm Validations Succeed
    needs:
      - helm-lint
      - helm-template
      - helm-lint-crds
      - helm-template-crds
      - helm-check-rbac
      - helm-check-values-schema
    runs-on: ubuntu-latest
    if: always()
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Check results
        run: |
          if [[ -n $(echo "$RESULTS" | jq '.[] | select (. != "success")') ]]; then
            exit 1
          fi
