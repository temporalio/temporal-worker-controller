name: Helm Chart Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Lint chart
        run: helm lint --strict helm/temporal-worker-controller

  helm-template:
    name: Template Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Template with default values
        run: helm template test-release helm/temporal-worker-controller

      - name: Check default and custom network settings
        run: |
          set -euo pipefail
          expect() {
            if ! grep -Fq -- "$1" <<< "$rendered"; then
              echo "missing $configuration setting: $1" >&2
              exit 1
            fi
          }

          for configuration in default custom; do
            args=()
            webhook_port=9443
            metrics_port=8080
            health_port=8081
            proxy_port=8443
            dns_policy=ClusterFirst
            if [[ "$configuration" == custom ]]; then
              webhook_port=10443
              metrics_port=18080
              health_port=18081
              proxy_port=18443
              dns_policy=ClusterFirstWithHostNet
              args=(--set hostNetwork=true --set dnsPolicy="$dns_policy"
                --set webhook.port="$webhook_port" --set metrics.port="$metrics_port"
                --set metrics.healthPort="$health_port" --set kubeRBACProxy.port="$proxy_port")
            fi
            rendered=$(helm template test-release helm/temporal-worker-controller "${args[@]}")
            expect "\"--webhook-port=$webhook_port\""
            expect "containerPort: $webhook_port"
            expect "targetPort: $webhook_port"
            expect "\"--metrics-bind-address=127.0.0.1:$metrics_port\""
            expect "--upstream=http://127.0.0.1:$metrics_port/"
            expect "\"--health-probe-bind-address=:$health_port\""
            if [[ $(grep -Ec "^[[:space:]]+port: $health_port$" <<< "$rendered") -ne 2 ]]; then
              echo "both $configuration health probes must use port $health_port" >&2
              exit 1
            fi
            expect "\"--secure-listen-address=0.0.0.0:$proxy_port\""
            expect "containerPort: $proxy_port"
            expect "name: https"
            expect "targetPort: https"
            expect "dnsPolicy: $dns_policy"
            if [[ "$configuration" == custom ]]; then
              expect "hostNetwork: true"
            elif grep -Fq 'hostNetwork: true' <<< "$rendered"; then
              echo "host networking must be disabled by default" >&2
              exit 1
            fi
          done

      - name: Check port schema boundaries
        run: |
          set -euo pipefail
          for key in webhook.port metrics.port metrics.healthPort kubeRBACProxy.port; do
            for port in 1 65535; do
              helm template test-release helm/temporal-worker-controller \
                --set "$key=$port" > /dev/null
            done
            for port in -1 0 65536 not-a-port; do
              if output=$(helm template test-release helm/temporal-worker-controller \
                --set "$key=$port" 2>&1); then
                echo "expected schema validation to reject $key=$port" >&2
                exit 1
              fi
              if ! grep -Fq "${key#*.}" <<< "$output"; then
                echo "unexpected validation error for $key=$port: $output" >&2
                exit 1
              fi
            done
          done

      - name: Template with namespace creation
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set namespace.create=true

      - name: Template with auth proxy disabled
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set metrics.disableAuth=true

      - name: Template with kube-rbac-proxy image override
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set kubeRBACProxy.image.registry=example.invalid \
            --set kubeRBACProxy.image.repository=kube-rbac-proxy \
            --set kubeRBACProxy.image.tag=test \
            --set kubeRBACProxy.image.pullPolicy=Always

      - name: Template with restricted watch namespaces
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set 'rbac.restrictWatchNamespaces={ns-a,ns-b}'

      - name: Template with stripped WRT HPA matchLabel prefixes
        run: |
          set -euo pipefail
          default_rendered=$(helm template test-release helm/temporal-worker-controller)
          echo "$default_rendered" \
            | grep -A1 'name: WRT_HPA_MATCH_LABELS_STRIP_TEMPORAL_PREFIX' \
            | grep -q 'value: "false"'

          enabled_rendered=$(helm template test-release helm/temporal-worker-controller \
            --set workerResourceTemplate.hpaMatchLabelsStripTemporalPrefix=true)
          echo "$enabled_rendered" \
            | grep -A1 'name: WRT_HPA_MATCH_LABELS_STRIP_TEMPORAL_PREFIX' \
            | grep -q 'value: "true"'

      - name: Template with extra manager environment variables
        run: |
          set -euo pipefail
          rendered=$(helm template test-release helm/temporal-worker-controller \
            --set-string 'extraEnv[0].name=HTTP_PROXY' \
            --set-string 'extraEnv[0].value=http://proxy.example.com:8080' \
            --set-string 'extraEnv[1].name=API_TOKEN' \
            --set-string 'extraEnv[1].valueFrom.secretKeyRef.name=controller-secrets' \
            --set-string 'extraEnv[1].valueFrom.secretKeyRef.key=api-token')
          echo "$rendered" | grep -q 'name: HTTP_PROXY'
          echo "$rendered" | grep -q 'value: http://proxy.example.com:8080'
          echo "$rendered" | grep -q 'name: API_TOKEN'
          echo "$rendered" | grep -q 'name: controller-secrets'
          echo "$rendered" | grep -q 'key: api-token'

      - name: Reject extraEnv entries without a name
        run: |
          if helm template test-release helm/temporal-worker-controller \
            --set-string 'extraEnv[0].value=http://proxy.example.com:8080'; then
            echo "expected helm template to fail when extraEnv is missing name" >&2
            exit 1
          fi

      - name: Template with end user roles disabled
        run: |
          helm template test-release helm/temporal-worker-controller \
            --set rbac.createEndUserRoles=false

  helm-lint-crds:
    name: Lint CRDs Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Lint CRDs chart
        run: helm lint --strict helm/temporal-worker-controller-crds

  helm-template-crds:
    name: Template CRDs Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      - name: Template CRDs chart
        run: helm template test-release helm/temporal-worker-controller-crds

  helm-check-rbac:
    name: Check Helm RBAC wasn't manually updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate and diff
        run: make manifests && git diff --exit-code helm/temporal-worker-controller/templates/rbac.yaml

  helm-check-values-schema:
    name: Check values.schema.json is generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate and diff
        run: make helm-values-schema && git diff --exit-code helm/temporal-worker-controller/values.schema.json

  helm-validate-succeed:
    name: All Helm Validations Succeed
    needs:
      - helm-lint
      - helm-template
      - helm-lint-crds
      - helm-template-crds
      - helm-check-rbac
      - helm-check-values-schema
    runs-on: ubuntu-latest
    if: always()
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Check results
        run: |
          if [[ -n $(echo "$RESULTS" | jq '.[] | select (. != "success")') ]]; then
            exit 1
          fi
