version: 2
updates:
  # One entry covering all Go modules. group-by: dependency-name makes Dependabot
  # raise one PR per dependency spanning every listed directory, rather than a
  # separate PR per module.
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/internal/demo"
      - "/internal/tests"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # We are deliberate about updating the temporal Go dependencies (api-go,
      # sdk-go, server, etc) because dependabot's inter-package dependency
      # resolution for the temporal Go packages is, well, terrible.
      - dependency-name: "go.temporal.io/*"
    groups:
      go-modules:
        applies-to: version-updates
        patterns:
          - "*"
        group-by: dependency-name

  - package-ecosystem: helm
    directory: "/helm/temporal-worker-controller"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # We are deliberate about updating cert-manager dependency in our Helm
      # chart. Keep this at >=1.0.0 and instruct dependabot to ignore this
      # dependency in our Chart.yaml file.
      - dependency-name: "cert-manager"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
