version: 2
updates:
  # One entry covering all Go modules. group-by: dependency-name makes Dependabot
  # raise one PR per dependency spanning every listed directory, rather than a
  # separate PR per module.
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/internal/demo"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # We are deliberate about updating the temporal Go dependencies (api-go,
      # sdk-go, server, etc) because dependabot's inter-package dependency
      # resolution for the temporal Go packages is, well, terrible.
      - dependency-name: "go.temporal.io/*"
      # Likewise, we are deliberate about updating the Kubernetes Go
      # dependencies (controller-runtime, api-machinery, etc) for the same
      # reason. Dependabot gets easily confused and cannot properly resolve
      # rebase conflicts.
      - dependency-name: "k8s.io/*"
      - dependency-name: "sigs.k8s.io/*"
      # We are deliberate about updating the OTEL Go dependencies because
      # dependabot cannot figure out that the OTEL Go package versions should
      # be pinned to what the temporal server Go package requires.
      - dependency-name: "go.opentelemetry.io/*"
    groups:
      go-modules:
        applies-to: version-updates
        patterns:
          - "*"
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
