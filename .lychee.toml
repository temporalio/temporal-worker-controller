# Link checker config, used by .github/workflows/docs-links.yml.
# Run locally: lychee --config .lychee.toml --offline '**/*.md'

include_fragments = "anchor-only"
max_concurrency = 8
max_retries = 3
timeout = 30

# CHANGELOG.md is generated by a bot and holds hundreds of historical links.
exclude_path = ["CHANGELOG.md"]

exclude = [
  # Reject automated clients with 403.
  '^https://(t\.mp|temporalio\.slack\.com)/',
  # Local-only addresses in examples and demos.
  '^https?://(localhost|127\.0\.0\.1)',
]
